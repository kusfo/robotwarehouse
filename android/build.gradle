ext {
    def versionPropsFile = file('version.properties')
    if (versionPropsFile.canRead()) {
        Properties versionProps = new Properties()
        versionProps.load(new FileInputStream(versionPropsFile))
        println("Version que se va a usar para compilar")
        println(versionProps)
        versionMajor = versionProps['APP_VERSION_MAJOR'].toInteger()
        versionMinor = versionProps['APP_VERSION_MINOR'].toInteger()
        versionPatch = versionProps['APP_VERSION_PATCH'].toInteger()
    } else {
        versionMajor = 0
        versionMinor = 1
        versionPatch = 80
    }
    versionBuildJob = System.getenv('BITBUCKET_BUILD_NUMBER') ?: 'local'
    debugSuffix = ".dev"
}
def generateVersionCode() {
    def majorPart = String.format("%01d", ext.versionMajor)
    def minorPart = String.format("%03d", ext.versionMinor)
    def patchPart = String.format("%03d", ext.versionPatch)
    return "${majorPart}${minorPart}${patchPart}".toInteger()
}
def generateVersionName() {
    return "${versionMajor}.${versionMinor}.${versionPatch}.${versionBuildJob}"
}

def increaseMinorNumber() {
    def versionPropsFile = file('version.properties')
    if(versionPropsFile.canRead()) {
        Properties versionProps = new Properties()
        versionProps.load(new FileInputStream(versionPropsFile))
        def major = versionProps['APP_VERSION_MAJOR']
        def minorUpdated =  versionProps['APP_VERSION_MINOR'].toInteger() + 1
        def patch = versionProps['APP_VERSION_PATCH']
        patch = "0"
        versionProps['APP_VERSION_MAJOR'] = major
        versionProps['APP_VERSION_MINOR'] = minorUpdated.toString()
        versionProps['APP_VERSION_PATCH'] = patch
        versionProps.store(versionPropsFile.newWriter(), null)
    }
}

def increasePatchNumber() {
    def versionPropsFile3 = file('version.properties')
    if(versionPropsFile3.canRead()) {
        Properties versionProps3 = new Properties()
        versionProps3.load(new FileInputStream(versionPropsFile3))
        println("Current version number")
        println(versionProps3)
        def major = versionProps3['APP_VERSION_MAJOR']
        def minor =  versionProps3['APP_VERSION_MINOR']
        def patchUpdated =  versionProps3['APP_VERSION_PATCH'].toInteger() + 1
        versionProps3['APP_VERSION_MAJOR'] = major
        versionProps3['APP_VERSION_MINOR'] = minor
        versionProps3['APP_VERSION_PATCH'] = patchUpdated.toString()
        println("New version number")
        println(versionProps3)
        versionProps3.store(versionPropsFile3.newWriter(), null)
    } else {
        Properties versionProps3 = new Properties()
        versionProps3['APP_VERSION_MAJOR'] = "0"
        versionProps3['APP_VERSION_MINOR'] = "1"
        versionProps3['APP_VERSION_PATCH'] = "30"
        versionProps3.store(versionPropsFile3.newWriter(), null)
    }
}
task prepareAlphaVersion() {
    doLast {
        increaseMinorNumber()
    }
}

task prepareInternalVersion() {
    doLast {
        increasePatchNumber()
    }
}
android {
    namespace "com.teenagemutantninjacoders.robotwarehouse"
    buildToolsVersion "33.0.2"
    compileSdkVersion 32
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }

    }
    packagingOptions {
        exclude 'META-INF/robovm/ios/robovm.xml'
    }
    defaultConfig {
        applicationId "com.teenagemutantninjacoders.robotwarehouse.android"
        minSdkVersion 20
        targetSdkVersion 32
        versionCode generateVersionCode()
        versionName generateVersionName()
    }

    signingConfigs {
        debug {
            keyAlias System.getenv("ROBOTWAREHOUSE_KEY_ALIAS")
            keyPassword System.getenv("ROBOTWAREHOUSE_KEY_PASSWORD")
            storeFile file(rootProject.projectDir.absolutePath + '/keystore/debugkeystore.jks')
            storePassword System.getenv("ROBOTWAREHOUSE_STORE_PASSWORD")
        }
        release {
            keyAlias System.getenv("ROBOTWAREHOUSE_KEY_ALIAS")
            keyPassword System.getenv("ROBOTWAREHOUSE_KEY_PASSWORD")
            storeFile file(rootProject.projectDir.absolutePath + '/keystore/globalkeystore.jks')
            storePassword System.getenv("ROBOTWAREHOUSE_STORE_PASSWORD")
        }
    }
    play {
        serviceAccountCredentials = file('../keystore/tmnp-publish-keys.json')
        track = 'internal'
    }
    buildTypes {
        release {
            applicationIdSuffix ""
            signingConfig signingConfigs.release
            resValue "string", "app_name", "RobotWarehouse"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix debugSuffix
            signingConfig signingConfigs.debug
            resValue "string", "app_name", "Dev RobotWarehouse"
        }
    }
}


// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86_64/").mkdirs()
        file("libs/x86/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}

tasks.register('run', Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty('sdk.dir')
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", 'shell', 'am', 'start', '-n', 'com.teenagemutantninjacoders.robotwarehouse/com.teenagemutantninjacoders.robotwarehouse.AndroidLauncher'
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads-lite:22.2.0'
}
eclipse.project.name = appName + "-android"