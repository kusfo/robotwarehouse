dialog_intro_a=Te doy la bienvenida a la ORC, la empresa de almacenes espaciales más importante del sistema
dialog_intro_b=Tenemos almacenes por todas las rutas de transporte
dialog_intro_c=Y nuestro cometido es abastecer las naves de carga que viajan entre estaciones
dialog_intro_d=Hasta ahora era el único humano que quedaba por aquí, los demás trabajadores son todos robots
dialog_intro_e=Y la verdad, creo que me tienen manía porque no paran de complicarme la vida...
dialog_intro_f=Pero bueno, nos apañaremos, sígueme y te enseñaré como va esto
dialog_newEpisode_1_a=Hoy va a ser un día tranquilo, así te dará tiempo a aclimatarte
dialog_newEpisode_1_b=Tenemos que hacer unos repartos sencillos en sectores sin mucha robotización
dialog_newEpisode_1_c=Pulsa en el primer panel que se ha desbloqueado y podremos empezar
dialog_newEpisode_2_a=Vaya, como pensaba, los robots han empezado a hacer de las suyas
dialog_newEpisode_2_b=En vez de ayudarme con los repartos, están desordenándolo todo
dialog_newEpisode_2_c=Seguro que planean echarme la culpa a mi, pues se van a enterar
dialog_newEpisode_2_d=No voy a dejar que esos listillos enlatados me dejen sin trabajo
dialog_newEpisode_3_a=Nos movemos a una parte del sistema donde las estaciones tienen una seguridad más alta
dialog_newEpisode_3_b=Disponen de unas torretas de vigilancia que disparan a cualquier intruso espacial
dialog_newEpisode_3_c=Solo espero que no estén aliadas con los robots, porque eso podría ser un problema...
dialog_newEpisode_4_a=Vaya, esperaba que no nos mandaran nunca a esta región...
dialog_newEpisode_4_b=Por aquí suele haber plagas de ratliens, unas criaturas odiosas que se lo comen todo
dialog_newEpisode_4_c=Debemos vigilar bien las mercancías o se las zamparán en un abrir y cerrar de ojos, en serio
dialog_firstRatliens_a=Recuerda, si ves algún ratlien, deshazte rápidamente de él o se intentará comer las mercancías
dialog_firstRatliens_b=Si se sube a alguna caja, aplástalo contra algo
dialog_firstRatliens_c=Son insaciables pero también bastante blanditos, je, je
dialog_energyBarriers_a=En esta base disponen de barreras láser, que funcionan igual que las sólidas
dialog_energyBarriers_b=La diferencia es que si alguno de los láseres toca una caja, la desintegrará
dialog_energyBarriers_c=Creo que no hace falta decir que no queremos eso, je
dialog_rotatingFloors_a=Mira, aquí disponen de cintas transportadoras, que es algo que va muy bien para mover las cajas
dialog_rotatingFloors_b=El problema es que creo que los robots las han reprogramado para complicarnos la vida
dialog_rotatingFloors_c=Úsalas con cuidado para mover las cajas, pero estate atento, que algunas cambian de dirección
dialog_necessaryPowers_a=En algunas estaciones hay tal cantidad de ratliens que es muy difícil trabajar
dialog_necessaryPowers_b=En estos casos, usar el poder de fumigación es casi obligatorio si quieres completar el reparto
dialog_levelSelection_basic_1_a=¡Hora de trabajar! Fíjate en esos hexágonos, cada uno representa un sector donde hay que hacer un reparto
dialog_levelSelection_basic_1_b=Pulsa en el número 1 para empezar, su color azul significa que está disponible
dialog_levelSelection_basic_2_a=¡Ese ha sido fácil, eh! Fijate, al completarlo has desbloqueado otro sector
dialog_levelSelection_basic_2_b=Vamos a por él y así te contaré algunas cosas más
dialog_levelSelection_ramification_a=A veces los sectores se separan en varios caminos, pero luego se vuelven a juntar en uno
dialog_levelSelection_ramification_b=Necesitarás completar todos los sectores que vayan hacia el camino principal para que este se desbloquee
dialog_levelSelection_challenges_basic_a=Algunos sectores te propondrán desafíos adicionales. Estos están marcados con una estrella azul
dialog_levelSelection_challenges_basic_b=Los desafíos no son necesarios para completar el sector, son opcionales y puedes hacerlos cuando quieras
dialog_levelSelection_challenges_basic_c=Pero si completas todos los de una zona de sectores, podrás acceder a los sectores experimentales
dialog_levelSelection_lastSector_a=Este es el último sector del camino, como ves tiene un indicador especial
dialog_levelSelection_lastSector_b=Si consigues completarlo, habremos terminado con esta zona de sectores
dialog_levelSelection_all_challenges_completed_a=Buen trabajo, ¡has completado todos los desafíos!
dialog_levelSelection_all_challenges_completed_b=Gracias a eso se han desbloqueado los sectores experimentales
dialog_levelSelection_all_challenges_completed_c=Estos son especialmente complicados y solo los más hábiles se atreven a hacer un reparto en ellos
dialog_levelSelection_all_challenges_completed_d=¿Qué dices, quieres probar?
dialog_levelSelection_starSector_a=Fijate en ese sector con una gran y llamativa estrella que hay más adelante
dialog_levelSelection_starSector_b=Para desbloquearlo tendrás que conseguir el número de estrellas que te indique
dialog_levelSelection_starSector_c=Estas las obtendrás completando los sectores que tiene alrededor
dialog_levelSelection_starSector_d=Pruébalo, cuantas más estrellas consigas en uno de esos sectores, más sumará
dialog_firstLevel_a=Aquí tenemos el primer cliente, un carguero que va hacia Ganímedes
dialog_firstLevel_b=Los cargueros vienen a nuestro almacén para abastecerse de materiales diversos que guardamos en cajas
dialog_firstLevel_c=Este nos pide 3 cajas, así que vamos a cargarlas antes de que se acabe el tiempo
dialog_secondLevel_a=Mira, este carguero hacia Caronte nos pide 6 cajas, pero ahora tenemos de dos tipos diferentes
dialog_secondLevel_b=Como antes, agrúpalas según su color para poder transportarlas
dialog_restartLevel_a=En algunos puzzles deberás vigilar con atención donde mueves las cajas
dialog_restartLevel_b=Podrías acabar con cajas en lugares sin salida o que sean imposibles de juntar con otras
dialog_restartLevel_c=Cuando esto ocurra, podrás reiniciar el nivel desde el menú de pausa
dialog_abyss_1_a=Uhm... que raro, parece que se han desactivado las barandillas de seguridad
dialog_abyss_1_b=Habrá que ir con cuidado, ahora las cajas podrían caerse al vacío
dialog_abyss_1_c=Si nos quedamos con menos stock del que nos piden, perderemos el pedido
dialog_stopBoxes_a=Una técnica muy útil consiste en bloquear el trayecto de una caja con otra
dialog_stopBoxes_b=Úsalo para evitar que caigan al vacío cuando no puedan pararse con ninguna pared
dialog_surplusBoxes_a=A veces hay más stock del que necesitamos, eso nos da un margen de error, pero no te confíes
dialog_surplusBoxes_b=Transportar un grupo de cajas puede dejar otras del mismo color sin posibilidad de agruparse
dialog_trapDoors_a=Parece que las escotillas de seguridad tampoco funcionan bien, esto empieza a ser sospechoso...
dialog_trapDoors_b=Intenta evitar que las cajas caigan por ellas o nos quedaremos sin stock
dialog_firstRobots_a=Prepárate, seguro que los robots del almacén van a intentar sabotearnos el trabajo
dialog_firstRobots_b=Si se ponen en medio o molestan, arróllalos con una caja
dialog_firstRobots_c=Se autorreparan muy rápido, ¡así que dales duro!
dialog_firstExplosiveRobots_a=Parece que los robots de abastecimiento se han sumado al saboteo
dialog_firstExplosiveRobots_b=No se que tienen planeado, pero me preocupa que vayan llenos de combustible...
dialog_firstFloorPoints_a=Una cosa más, fijate en ese símbolo del suelo, puede que te interese
dialog_firstFloorPoints_b=Si consigues activarlo, obtendrás puntos adicionales
dialog_firstFloorPoints_c=Intenta siempre activar tantos como puedas y conseguirás mejores resultados
dialog_firstFloorPowers_a=Existen otro tipo de símbolos activables, además de los que dan puntos
dialog_firstFloorPowers_b=Tienen forma de engranaje y si los activas, pueden proporcionarte una ventaja temporal
dialog_firstFloorPowers_c=Prueba a activarlos y a ver que pasa
dialog_firstCannon_a=Parece que las torretas están haciendo su trabajo, es un alivio
dialog_firstCannon_b=Vale... retiro lo dicho, no te pongas delante de las torretas
dialog_nothing=. . .
dialog_firstBarriers_a=Estas instalaciones son más modernas y disponen de barreras automáticas
dialog_firstBarriers_b=Se utilizan para distribuir los espacios de trabajo
dialog_firstBarriers_c=Pero como era de esperar, los robots los están usando para entorpecer el nuestro...
dialog_firstButtons_a=También existen las barreras que se activan manualmente
dialog_firstButtons_b=Hay que poner cajas encima de los botones del color de las barreras para activarlas
dialog_boxButtons_a=Aquí tenemos unos botones un poco especiales, solo se activan con las cajas de su color
dialog_boxButtons_b=Si pones cualquier otra caja encima, no harán nada
dialog_improveScore_a=Para obtener más estrellas tienes que hacer una buena puntuación y hay varias formas de conseguirlo
dialog_improveScore_b=Primero están los grupos de cajas transportadas, cuanto más grande sea el grupo, más puntos conseguirás
dialog_improveScore_c=Otra cosa que da puntos es el tiempo sobrante, que se multiplicará por este número al completar el sector
dialog_improveScore_d=Tampoco olvides que por cada caja que pierdas, te descontarán puntos, así que cuida bien las mercancías
dialog_improveScore_e=Y por último, están los puntos recolectables del suelo, ¡si hay alguno, no te olvides de cogerlo!
dialog_baseEpisodes_completed_a=Enhorabuena, ha sido duro pero has conseguido completar todos los repartos
dialog_baseEpisodes_completed_b=Yo solo no habría podido con tanto trabajo y problemas añadidos, ¡ha sido increíble!
dialog_baseEpisodes_completed_c=Ahora, si no lo has hecho ya, puedes intentar completar todos los desafíos que te falten
dialog_baseEpisodes_completed_d=Así podrás acceder a los complicados sectores experimentales
dialog_baseEpisodes_completed_e=Intentar conseguir todas las estrellas posibles será un verdadero reto, ¡pero seguro que tú puedes!
