tutorial_body1a=Tu tarea consiste en\ncargar las cajas que te\npidan las naves.\n\nTienes un stock limitado\nasí que cuidado\n¡no te quedes sin cajas!
tutorial_body1b=Empuja las cajas con el dedo para hacer que se deslicen
tutorial_body1c=Agrupa tres o más cajas del mismo color y transportalas realizando una pulsación doble sobre ellas
tutorial_body2a=Si un color se queda con menos de 3 cajas, las restantes se anularan y se quitarán del stock
tutorial_body3a=Transporta las cajas mientras estén sobre los puntos del suelo para adquirirlos
tutorial_body4a=Para activar la ventaja, transporta las cajas ocupando todos los símbolos que estén juntos
tutorial_body5a=Cuando las barreras están arriba, actúan como cualquier otro muro con el que colisionar
tutorial_body5b=Cuando las barreras están abajo, el camino queda libre, ¡pero cuidado con dejar una caja encima!
tutorial_body6a=Pon cualquier caja encima del botón correspondiente al color de la barrera para activarla
tutorial_body6b=Si hay más de un botón del mismo color, tendrás que activarlos todos
tutorial_body7a=Los botones que tengan el mismo color que las cajas solo pueden ser activados por estas
tutorial_body8a=Mueve una caja sobre una cinta transportadora y esta lanzará tu caja en la dirección en la que apunte su flecha
tutorial_body8b=Ten cuidado porque las flechas pueden cambiar de dirección y darte algún disgusto