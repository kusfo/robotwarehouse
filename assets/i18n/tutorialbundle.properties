tutorial_body1a=Your duty is load all the\ncargo that each ship ask for.\n\n\nYou have a limited stock so\ndo a good job if you don't want\nto be fired
tutorial_body1b=Push the boxes with the finger to make them slip
tutorial_body1c=Group three or more boxes of the same color and transport them with double tap
tutorial_body2a=If one color has less than 3 boxes available, the remaining ones will be nulled and subtracted from the stock
tutorial_body3a=Transport the boxes while they're over the points on the floor to acquire them
tutorial_body4a=To trigger the advantage, transport the boxes while occupying all the symbols sitting together
tutorial_body5a=When the barriers are up, they behave as any other wall that you can collide with
tutorial_body5b=When the barriers are down, the path is open, but be careful not to leave a box over it!
tutorial_body6a=Put any box over the right color button to enable the barrier
tutorial_body6b=If there're more than one button with the same color, you should enabled all of them
tutorial_body7a=Buttons with the same color as boxes, can only be enabled by the right color box.
tutorial_body8a=Move a box over a conveyor belt and it'll throw your box in the direction its arrow it's pointing
tutorial_body8b=Be careful, as the arrows can change and point to another direction and ruin your plans