dialog_intro_a=Et dono la benvinguda a la ORC, l'empresa de magatzems espacials més important del sistema
dialog_intro_b=Tenim magatzems per totes les rutes de transport
dialog_intro_c=I la nostra tasca es abastir les naus de càrrega que viatgen entre estacions
dialog_intro_d=Fins ara era l'únic humà que quedava per aquí, la resta de treballadors són tots robots
dialog_intro_e=I la veritat, crec que em tenen mania perquè no paren de fer-me la guitza...
dialog_intro_f=Bé, en tot cas, ens en sortirem, segueix-me i t'ensenyo com funciona això
dialog_newEpisode_1_a=Avui serà un dia tranquil, així et donarà temps de fer l'adaptació
dialog_newEpisode_1_b=Hem de realitzar uns repartiments senzills en sectors sense gaire robotització
dialog_newEpisode_1_c=Prem al primer panell que s'ha desbloquejat i podem començar
dialog_newEpisode_2_a=Vaja, tal com m'esperava, els robots han començat a fer de les seves
dialog_newEpisode_2_b=Enlloc d'ajudar-me amb els repartiments, ho estan desordenant tot
dialog_newEpisode_2_c=Estic segur que volen carregar-me el mort, doncs ja veuran
dialog_newEpisode_2_d=No deixaré que aquests setciències enllaunats em deixin sense feina
dialog_newEpisode_3_a=Ens movem a una part del sistema on les estacions tenen una seguretat més alta
dialog_newEpisode_3_b=Disposen d'unes torretes de vigilància que obren foc sobre qualsevol intrús espaial
dialog_newEpisode_3_c=Espero que s'hagin posat d'acord amb els robots, per que això podría ser un problema...
dialog_newEpisode_4_a=Ondia, no esperava que ens enviessin mai a aquesta regió...
dialog_newEpisode_4_b=Per aquí solen haver plagues de ratliens, unes criatures odioses que s'ho mengen tot
dialog_newEpisode_4_c=Hem de vigilar bé les mercaderies o se les cruspiran en un tres i no res, t'ho juro
dialog_firstRatliens_a=Recorda, si veus un ratlien, desempallegat d'ell o provarà de menjar-se les mercaderies
dialog_firstRatliens_b=Si s'enfila a una caixa, esclafa'l contra la primera cosa que trobis
dialog_firstRatliens_c=Són insaciables però bastant tovets, ha, ha
dialog_energyBarriers_a=A aquesta base disposen de barreres làser, que funcionen igual que les sòlides
dialog_energyBarriers_b=La diferència és que si un làser toca una caixa, la desintegrarà
dialog_energyBarriers_c=No cal dir que no ho volem això, ha, ha
dialog_rotatingFloors_a=Mira, aquí disposen de cintes transportadores, que van molt bé per moure caixes
dialog_rotatingFloors_b=El problema és que crec que els robots les han reprogramat per fer-nos la vida més complicada
dialog_rotatingFloors_c=Fes-ne ús amb precaució, però para atenció, que algunes canvien de direcció
dialog_necessaryPowers_a=En algunes estacions hi ha tants ratliens que és molt difícil treballar
dialog_necessaryPowers_b=En aquests casos, fer servir el poder de fumigació és quasi obligatori si vols acabar el repartiment
dialog_levelSelection_basic_1_a=Hora de treballar! Fixa't en aquells hexàgons, cadascun representa un sector on s'ha de fer un repartiment
dialog_levelSelection_basic_1_b=Prem el número 1 per començar, el seu color blau significa que es troba disponible
dialog_levelSelection_basic_2_a=Aquest ha estat senzill, eh! Para atenció, al completar-lo has desbloquejat un altre sector
dialog_levelSelection_basic_2_b=Anem a per ell i així t'explico unes coses més
dialog_levelSelection_ramification_a=A vegades els sectors se separen en diversos camins, però després es tornen a ajuntar
dialog_levelSelection_ramification_b=Hauràs de completar tots els sectors que vagin cap al camí principal per tal que aquest es desbloquegi
dialog_levelSelection_challenges_basic_a=Alguns sectors et proposen desafiaments addicionals. Aquests es troben marcats amb una estrella blava
dialog_levelSelection_challenges_basic_b=Els desafiaments no són necessaris per a completar el sector, són opcionals i pots fer-los quan vulguis
dialog_levelSelection_challenges_basic_c=No obstant, si completes tots els d'una zona de sectors, tindràs accés als sectors experimentals
dialog_levelSelection_lastSector_a=Aquest és l'últim sector del camí, com veus té un indicador especial
dialog_levelSelection_lastSector_b=Si aconsegueixes completar-lo, haurem acabat amb aquest zona de sectors
dialog_levelSelection_all_challenges_completed_a=Bona feina, has completat tots els desafiaments!
dialog_levelSelection_all_challenges_completed_b=Gràcies a això s'han desbloquejat els sectors experimentals
dialog_levelSelection_all_challenges_completed_c=Aquests són especialment complicats i només els més hàbils s'atreveixen a fer un repartiment allà
dialog_levelSelection_all_challenges_completed_d=Què dius, vols provar?
dialog_levelSelection_starSector_a=Fixa't en aquell sector amb una gran estrella cridanera que hi ha més endavant
dialog_levelSelection_starSector_b=Per a desbloquejar-lo hauràs d'aconseguir el número d'estrelles que t'indiqui
dialog_levelSelection_starSector_c=Les obtindràs completant els sectors que té al voltant
dialog_levelSelection_starSector_d=Prova-ho, com més estrelles aconsegueixis en un d'aquests sectors, més sumarà
dialog_firstLevel_a=Tenim aquí al primer client, una nau de càrrega que va cap a Ganimedes
dialog_firstLevel_b=Les naus de càrrega venen al nostre magatzem per a proveir-se de diferents materials que guardem en caixes
dialog_firstLevel_c=Aquest ens demana 3 caixes, anem a carregar-les abans no se'ns acabi el temps
dialog_secondLevel_a=Guaita, aquesta nau de càrrega cap a Caront ens demana 6 caixes, però ara en tenim de dos classes diferents
dialog_secondLevel_b=Igual que abans, agrupa-les segons el seu color per a poder transportar-les
dialog_restartLevel_a=En alguns puzzles hauràs d'anar amb compte d'on mous les caixes
dialog_restartLevel_b=Pots acabar amb caixes en racons sense sortida o que sigui impossible juntar-les amb altres
dialog_restartLevel_c=Quan això passi, pots reiniciar el nivell des del menú de pausa
dialog_abyss_1_a=Mmm...que estrany, sembla que s'han deshabilitat les baranes de seguretat
dialog_abyss_1_b=Haurem d'anar amb compte, ara les caixes podrien caure al buit
dialog_abyss_1_c=Si ens quedem amb menys stock del que ens demanen, perdrem la comanda
dialog_stopBoxes_a=Una tècnica molt útil consisteix en bloquejar el trajecte d'una caixa amb una altra
dialog_stopBoxes_b=Utilitza-la per a evitar que caiguin al buit quan no hi ha cap paret per aturar-les
dialog_surplusBoxes_a=A vegades hi ha més stock del que necessitem, això ens dona un marge d'error, però no et confiïs
dialog_surplusBoxes_b=Transportar un grup de caixes pot deixar altres del mateix color sense poder agrupar-se
dialog_trapDoors_a=Sembla que les escotilles de seguretat tampoc rutllen bé, això comença a olorar malament...
dialog_trapDoors_b=Intenta evitar que les caixes hi caiguin o ens quedarem sense stock
dialog_firstRobots_a=Prepara't, de segur que els robots del magatzem intentaran sabotejar-nos la feina
dialog_firstRobots_b=Si es posen pel mig o et molesten, atropella'ls amb una caixa
dialog_firstRobots_c=S'autoreparen molt ràpidament, així que no tinguis pietat!
dialog_firstExplosiveRobots_a=Sembla que els robots d'abastiment s'han sumat al sabotatge
dialog_firstExplosiveRobots_b=No sé quina en porten de cap, però em preocupa que vagin plens de combustible...
dialog_firstFloorPoints_a=Una cosa més, fixa't en aquest símbol del terra, potser t'interessa
dialog_firstFloorPoints_b=Si aconsegueixes activar-lo, obtindràs punts addicionals
dialog_firstFloorPoints_c=Intenta activar-ne tants com puguis i aconseguiràs millors resultats
dialog_firstFloorPowers_a=Existeix un altre tipus de símbols activables, a més dels que donen punts
dialog_firstFloorPowers_b=Tenen forma d'engranatge i, si els actives, poden proporcionar-te un avantatge temporal
dialog_firstFloorPowers_c=Prova d'activar-los i mira que passa
dialog_firstCannon_a=Sembla que les torretes estan fent la seva feina, és un alleujament
dialog_firstCannon_b=D'acord... retiro el que he dit, no et posis davant les torretes
dialog_nothing=. . .
dialog_firstBarriers_a=Aquestes instal·lacions són més modernes i disposen de barreres automàtiques
dialog_firstBarriers_b=S'empren per distribuir els espais de treball
dialog_firstBarriers_c=Però com podíem esperar, els robots les estan fent servir per fer-nos nosa...
dialog_firstButtons_a=També existeixen les barreres que s'activen de forma manual
dialog_firstButtons_b=Cal posar caixes sobre els botons del color de les barreres per tal d'activar-les
dialog_boxButtons_a=Aquí tenim uns botons una mica especials, només s'activen amb les caixes del seu color
dialog_boxButtons_b=Si poses qualsevol altra caixa a sobre, no faran res
dialog_improveScore_a=Per a obtenir més estrelles has d'aconseguir una bona puntuació i hi ha diferents formes d'aconseguir-ho
dialog_improveScore_b=Primer, hi ha els grups de caixes transportades, com més gran sigui el grup, més punts rebràs
dialog_improveScore_c=També reps punts pel temps sobrant, que es multiplicarà per aquesta xifra al completar el sector
dialog_improveScore_d=Tampoc t'oblidis que per cada caixa que perdis, et descompten punts, així que tingues cura de les mercaderies
dialog_improveScore_e=Per últim, hi ha els punts col·leccionables del terra, si n'hi ha algún, no t'oblidis d'agafar-lo!
dialog_baseEpisodes_completed_a=Enhorabona, ha estat dur però has aconseguit completar tots els repartiments
dialog_baseEpisodes_completed_b=Jo sol no podria haver-ho fet amb tanta feina i problemes afegits, ha estat increïble!
dialog_baseEpisodes_completed_c=Ara, si encara no ho has fet, pots intentar completar tots els desafiaments que et falten
dialog_baseEpisodes_completed_d=Així podràs accedir als complicats sectors experimentals
dialog_baseEpisodes_completed_e=Intentar aconseguir totes les estrelles possibles serà tot un desafiament, però segur que ho pots fer!
