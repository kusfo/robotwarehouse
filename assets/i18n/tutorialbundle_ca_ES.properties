tutorial_body1a=La teva tasca consisteix en \ncarregar les caixes que et\ndemanin les naus.\n\nTens un stock limitat\naixí que ves amb compte\nque no et quedis sense caixes!
tutorial_body1b=Empeny les caixes amb el dit per a fer que llisquin
tutorial_body1c=Agrupa tres o més caixes del mateix color, i transporta-les realitzant una pulsació doble sobre elles
tutorial_body2a=Si un color es queda amb menys de 3 caixes, les restants s'anularan i es restaran del stock
tutorial_body3a=Transporta les caixes mentres estiguin sobre els punts del terra per a obtenir-los
tutorial_body4a=Per a activar la ventatja, transporta les caixes ocupant tots els símbols que estiguin junts
tutorial_body5a=Quan les barreres es troben pujades, es comporten com qualsevol mur amb els que fem col·lisió
tutorial_body5b=Quan les barreres es troben baixades, el camí es lliure, però para atenció de no deixar-hi una caixa a sobre!
tutorial_body6a=Deixa qualsevol caixa sobre el botó corresponent al color de la barrera per a activar-la
tutorial_body6b=Si hi ha més d'un botó del mateix color, hauràs d'activar-los tots
tutorial_body7a=Els botons que tenen el mateix color que les caixes només es poden activar per les d'aquell color. 
tutorial_body8a=Mou una caixa sobre una cinta transportadora i aquesta llençarà la teva caixa en la direcció a la que apunta la seva fletxa
tutorial_body8b=Ves amb compte perquè les fletxes poden canviar de direcció i donar-te un disgust