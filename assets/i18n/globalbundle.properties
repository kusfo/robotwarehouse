dialog_intro_a=Welcome to ORC, the biggest space warehouse company in the system
dialog_intro_b=We have warehouses running along all the trade routes
dialog_intro_c=And our duty is to supply the ships travelling between stations
dialog_intro_d=I was the only human working here until now, the rest of the workers are all robots
dialog_intro_e=And I think they don't like me because they're always picking on me
dialog_intro_f=Well, but we'll manage. Follow me, I'll show you how it works
dialog_newEpisode_1_a=Today is gonna be a quiet day, so you'll have time to adjust
dialog_newEpisode_1_b=We've to do some simple deliveries at sectors without much automation
dialog_newEpisode_1_c=Tap on the first unlocked panel, and we can start.
dialog_newEpisode_2_a=Wow, as I supposed, the robots have started being up to their old tricks
dialog_newEpisode_2_b=Instead of helping with the deliveries, they're messing everything up
dialog_newEpisode_2_c=I'm sure they want to blame me for everything, but they don't know me
dialog_newEpisode_2_d=I won't allow these canned smarty pants to make me redundant
dialog_newEpisode_3_a=We're going to a region in the system where stations have a higher security
dialog_newEpisode_3_b=They've some surveillance turrets that fire to any space intruder
dialog_newEpisode_3_c=I only hope they're not together with the robots, that could be a problem...
dialog_newEpisode_4_a=Oh, I hoped they would never send us to this region...
dialog_newEpisode_4_b=Here it's usual to encounter Ratlien pests, hateful creatures that eat everything
dialog_newEpisode_4_c=We've to take care of the boxes or they'll eat them, seriously
dialog_firstRatliens_a=Remember, if you see any Ratlien, get rid of him quickly or it would try to eat the boxes
dialog_firstRatliens_b= If it climbs a box, smash it against the wall 
dialog_firstRatliens_c=They're insatiable but also quite soft, he, he
dialog_energyBarriers_a=In this base they have laser barriers, they work like the solid ones
dialog_energyBarriers_b=The difference is that if one laser touches a box, it'll disintegrate it
dialog_energyBarriers_c=It's clear that we don't want that, he, he
dialog_rotatingFloors_a=Look, here they have conveyor belts, they're really useful to move boxes
dialog_rotatingFloors_b=The problem is that it seems the robots have reprogrammed them to make our life harder
dialog_rotatingFloors_c=Use them carefully, but you should pay attention, as some of them change direction
dialog_necessaryPowers_a=In some stations, there are so many ratliens that working becomes really hard
dialog_necessaryPowers_b=In this case, using the fumigation power is almost mandatory if you want to fulfil your duty
dialog_levelSelection_basic_1_a=Work time! Take a look at these hexagons, each of them is a sector when we have to do a delivery
dialog_levelSelection_basic_1_b=Tap on the number 1 to start, the blue color means it's selectable
dialog_levelSelection_basic_2_a=That was an easy one! Look, after completing it you have unlocked another sector. 
dialog_levelSelection_basic_2_b=Let's go for it and I'll tell you a couple more things
dialog_levelSelection_ramification_a=Sometimes sectors split on different paths, but they merge afterwards
dialog_levelSelection_ramification_b=You've to complete all the sectors coming to the main path to unlock it
dialog_levelSelection_challenges_basic_a=Some sectors will bring additional challenges. They have a blue star on them
dialog_levelSelection_challenges_basic_b=Challenges are not necessary to complete the sector, they're optional and you can do them whenever you want
dialog_levelSelection_challenges_basic_c=But if you complete them all in a sector zone, you'll get access to the experimental sectors
dialog_levelSelection_lastSector_a=This is the last sector on the path, it has a special sign
dialog_levelSelection_lastSector_b=If you're able to complete it, we'll have finished with this sector zone
dialog_levelSelection_all_challenges_completed_a=Good job, you have completed all the challenges!
dialog_levelSelection_all_challenges_completed_b=Thank that you have unlocked the experimental sectors
dialog_levelSelection_all_challenges_completed_c=These are particularly hard and only the most skilled dare to deliver there
dialog_levelSelection_all_challenges_completed_d=So, Do you want to try?
dialog_levelSelection_starSector_a=Look at that sector with a big and shiny star in front of us
dialog_levelSelection_starSector_b=To unlock it, you have to get the number of stars displayed on it
dialog_levelSelection_starSector_c=You'll get them completing the sectors around it
dialog_levelSelection_starSector_d=Give it a try, the more stars you achieve in a sector, the more will be added
dialog_firstLevel_a=Here we have our first customer, a freighter bound to Ganymede
dialog_firstLevel_b=Freighters come to our warehouse to obtain several resources we store in boxes
dialog_firstLevel_c=This one is requesting 3 boxes, so we'll load them before the time runs out
dialog_secondLevel_a=This freighter to Charon is asking for 6 boxes, but we've two different types now
dialog_secondLevel_b=Like the previous sector, just group them by color to transport them
dialog_restartLevel_a=In some puzzles, you need to pay attention to where are you moving the boxes
dialog_restartLevel_b=You may end up with boxes in a cul-de-sac or be unable to bring them together with other boxes
dialog_restartLevel_c=If that happens, you can restart the level from the pause menu
dialog_abyss_1_a=Uhm... that's weird, it seems someone has disabled the security railings
dialog_abyss_1_b=We'll have to handle the boxes with care, they can now fall into the void
dialog_abyss_1_c=If we end up with less stock than necessary, we'll lose the order
dialog_stopBoxes_a=A clever trick is to use one box to block the path of another one
dialog_stopBoxes_b=Use it to make boxes not fall into the void when they haven't any wall to stop
dialog_surplusBoxes_a=Sometimes we have more stock than it's needed, so we have a little error margin, but be careful
dialog_surplusBoxes_b=Transporting a group of boxes may cause others of the same color to end up not being able to be grouped
dialog_trapDoors_a=It seems that the security hatches are also not working correctly, this smells fishy...
dialog_trapDoors_b=Try to avoid them or the boxes would fall to the void and we'll be without stock
dialog_firstRobots_a=Be careful, the warehouse robots will try to sabotage our work
dialog_firstRobots_b=If they bother you or are in the middle of the path, run over them using a box
dialog_firstRobots_c=They're able to fix themselves quite fast, so hit them hard!
dialog_firstExplosiveRobots_a=It seems the supply robots have joined the saboteurs
dialog_firstExplosiveRobots_b=I don't know its plans, but I'm worried they're full of fuel...
dialog_firstFloorPoints_a=One thing more, look at that icon on the floor, it might be interesting to you
dialog_firstFloorPoints_b=If you trigger it, you'll get additional points
dialog_firstFloorPoints_c=Try to trigger as many as you can and you'll get better scores
dialog_firstFloorPowers_a=There's another kind of icon, apart from the ones that give points
dialog_firstFloorPowers_b=They're shaped like gear and if you trigger them, they'll give you a temporal benefit
dialog_firstFloorPowers_c=Try to trigger them and see what happens
dialog_firstCannon_a=It seems that the turrets are doing their job, that's a relieve
dialog_firstCannon_b=Ok... forget it, don't stand in front of the turrets.
dialog_nothing=. . .
dialog_firstBarriers_a=These facilities are more modern and have automated barriers
dialog_firstBarriers_b=They're used to divide the workspace
dialog_firstBarriers_c=But as it was expected, the robots are using them to sabotage our work...
dialog_firstButtons_a=Also, some barriers are triggered manually
dialog_firstButtons_b=You've to put boxes over the buttons with the same color as the barrier to enable them
dialog_boxButtons_a=Here we have some special buttons, they're only triggered with the same color boxes
dialog_boxButtons_b=If you put any other box, they won't do anything
dialog_improveScore_a=To win more stars you need a good score, and there are several ways to achieve it
dialog_improveScore_b=First, the groups of transported boxes. The bigger the group, the higher the score
dialog_improveScore_c=Second, the remaining time, that will be multiplied by this figure when completing a sector
dialog_improveScore_d=You also have to take into account that for each box you lose, you'll have points deducted, so take care of the ware
dialog_improveScore_e=And last but not least, there're collectable points on the floor. Don't forget to collect them!
dialog_baseEpisodes_completed_a=Congratulations, it's been hard but you managed to complete all the deliveries
dialog_baseEpisodes_completed_b=I couldn't have dot it alone, with so much workload and unexpected problems. It has been amazing!
dialog_baseEpisodes_completed_c=Now, if you haven't done it yet, You can try to complete all the pending challenges
dialog_baseEpisodes_completed_d=That way you will get access to the complex experimental sectors
dialog_baseEpisodes_completed_e=Trying to get all the possible stars will be a challenge, but I'm sure you can do it!
